name: Frontend Lint

on:
  push:
  pull_request:

jobs:
  lint-frontend:
    runs-on: ubuntu-lastest

    steps:
      - name: Checkout del codigo
        uses: actions/ckeckout@v4
      
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar lenters
        run: |
          npm install -g htmlhint
          npm install -g stylelint stylelint-config-standard
          npm install -g eslint

      - name: Lint HTML
        run: |
          htmlhint "app/src/main/resources/static/pages/**/*.html" || true

      - name: Lint CSS
        run: |
          stylelint "app/src/main/resources/static/assets/css/**/*.css" || true
      
      - name: Lint JavaScript
        run: |
          eslint "app/src/main/resources/static/js/**/*.js" || true